<!doctype html>
<html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jastuk za spravu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: full-screen 3D stage, spec card top-left, control bar bottom */
:root {
  --bg: #e7e9ec;
  --bg2: #d4d8de;
  --panel: rgba(255,255,255,.86);
  --fg: #1b1f24;
  --muted: #5b6470;
  --line: rgba(27,31,36,.12);
  --accent: #c2410c;
  --accent-fg: #ffffff;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16191d; --bg2: #23282e; --panel: rgba(30,34,40,.88); --fg: #eef0f2; --muted: #9aa3ad;
  --line: rgba(238,240,242,.14); --accent: #fb8a4c; --accent-fg: #1b1f24; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #16191d; --bg2: #23282e; --panel: rgba(30,34,40,.88); --fg: #eef0f2; --muted: #9aa3ad;
  --line: rgba(238,240,242,.14); --accent: #fb8a4c; --accent-fg: #1b1f24; color-scheme: dark }

html, body { height: 100%; }
body { background: radial-gradient(ellipse at 50% 40%, var(--bg) 0%, var(--bg2) 100%); background-color: var(--bg); color: var(--fg); font-family: var(--sans); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; touch-action: none; }
#labels { position: fixed; inset: 0; pointer-events: none; }

.card {
  position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  background: var(--panel); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px; max-width: min(300px, calc(100vw - 32px)); display: grid; gap: 8px;
}
.card h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.specs { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 12.5px; }
.specs dt { color: var(--muted); }
.specs dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; }

.bar {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: max-content; max-width: calc(100vw - 32px);
  background: var(--panel); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 12px; padding: 6px;
}
.bar .sep { width: 1px; background: var(--line); margin: 4px 2px; }
button {
  font: 500 13px var(--sans); color: var(--fg); background: transparent; border: 1px solid transparent;
  border-radius: 8px; padding: 8px 11px; cursor: pointer;
}
button:hover { background: var(--line); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.hint { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(14px + env(safe-area-inset-top, 0px)); font-size: 12px; color: var(--muted); text-align: right; }

.dim {
  font: 500 12px var(--mono); color: var(--accent-fg); background: var(--accent); padding: 2px 6px; border-radius: 4px; white-space: nowrap;
}
.dim.est { background: var(--panel); color: var(--fg); border: 1px dashed var(--accent); }

@media (max-width: 640px) {
  .hint { display: none; }
  .card { padding: 10px 12px; }
  .card p { display: none; }
  button { padding: 7px 9px; font-size: 12.5px; }
}
</style>

<div id="stage"></div>
<div id="labels"></div>

<div class="card">
  <h1>Jastuk za spravu za vežbanje</h1>
  <dl class="specs">
    <dt>Daska</dt><dd>10 × 30 × 1,5 cm</dd>
    <dt>Nosač</dt><dd>kvadratna cev 4 × 4 cm</dd>
    <dt>Sunđer</dt><dd>0,5 cm</dd>
    <dt>Presvlaka</dt><dd>crna veštačka koža</dd>
    <dt>Zadnja strana</dt><dd>filc, heftano</dd>
    <dt>Spoj</dt><dd>2 vijka kroz nosač</dd>
  </dl>
  <p>Razmak vijaka (≈22 cm) je procenjen sa fotografije.</p>
</div>

<div class="hint">Prevucite za okretanje<br>Točkić ili dva prsta za zum</div>

<div class="bar" role="toolbar" aria-label="Prikaz modela">
  <button id="vFront" type="button">Spreda</button>
  <button id="vBack" type="button">Pozadi</button>
  <button id="vSide" type="button">Sa strane</button>
  <span class="sep" aria-hidden="true"></span>
  <button id="tDims" type="button" aria-pressed="true">Mere</button>
  <button id="tExplode" type="button" aria-pressed="false">Rastavi</button>
  <button id="tGhost" type="button" aria-pressed="false">Unutra</button>
  <button id="tSpin" type="button" aria-pressed="true">Rotacija</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// Units: centimetres. Y = length (vertical), X = width, +Z = padded front, -Z = back with tube.
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
stage.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer({ element: document.getElementById('labels') });

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, 1, 0.5, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 25;
controls.maxDistance = 220;
controls.target.set(0, 0, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x444450, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(40, 60, 70);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 250 });
key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.8);
rim.position.set(-50, 20, -60);
scene.add(rim);

// ---------- procedural textures ----------
function canvasTex(size, draw, repeat) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (repeat) t.repeat.set(...repeat);
  t.anisotropy = 8;
  return t;
}
// pebbled leather grain
const leatherBump = canvasTex(512, (g, s) => {
  g.fillStyle = '#808080'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 9000; i++) {
    const x = Math.random() * s, y = Math.random() * s, r = 1.5 + Math.random() * 4;
    const v = 100 + Math.random() * 110;
    g.fillStyle = `rgb(${v},${v},${v})`;
    g.beginPath(); g.ellipse(x, y, r, r * (0.6 + Math.random() * 0.5), Math.random() * 3, 0, Math.PI * 2); g.fill();
  }
}, [2, 5]);
// non-woven backing fabric (diamond emboss)
const fabricTex = canvasTex(256, (g, s) => {
  g.fillStyle = '#3c3c40'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 4000; i++) {
    const v = 30 + Math.random() * 30;
    g.fillStyle = `rgba(${v},${v},${v + 3},.6)`;
    g.fillRect(Math.random() * s, Math.random() * s, 2 + Math.random() * 4, 1);
  }
  g.fillStyle = 'rgba(70,70,74,.55)';
  const step = 8;
  for (let y = 0; y < s; y += step) for (let x = (y / step) % 2 ? step / 2 : 0; x < s; x += step) {
    g.beginPath(); g.moveTo(x, y - 2); g.lineTo(x + 2, y); g.lineTo(x, y + 2); g.lineTo(x - 2, y); g.fill();
  }
}, [3, 10]);
// wood grain for the board
const woodTex = canvasTex(512, (g, s) => {
  g.fillStyle = '#c8a06a'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 140; i++) {
    const y = Math.random() * s; const a = 0.05 + Math.random() * 0.15;
    g.strokeStyle = `rgba(120,80,40,${a})`; g.lineWidth = 1 + Math.random() * 3;
    g.beginPath(); g.moveTo(0, y);
    for (let x = 0; x <= s; x += 32) g.lineTo(x, y + Math.sin(x / 60 + i) * 4);
    g.stroke();
  }
}, [1, 1]);
woodTex.colorSpace = THREE.SRGBColorSpace;
fabricTex.colorSpace = THREE.SRGBColorSpace;

// ---------- materials ----------
const vinyl = new THREE.MeshPhysicalMaterial({
  color: 0x1a1a1c, roughness: 0.55, metalness: 0, clearcoat: 0.35, clearcoatRoughness: 0.5,
  bumpMap: leatherBump, bumpScale: 0.6, transparent: true, opacity: 1
});
const fabric = new THREE.MeshStandardMaterial({ map: fabricTex, roughness: 0.95, transparent: true, opacity: 1 });
const powder = new THREE.MeshStandardMaterial({ color: 0x141416, roughness: 0.38, metalness: 0.45 });
const zinc = new THREE.MeshStandardMaterial({ color: 0xe4e8ee, roughness: 0.3, metalness: 0.75, envMapIntensity: 1.6 });
const recess = new THREE.MeshStandardMaterial({ color: 0x3a3d42, roughness: 0.6, metalness: 0.8 });
const staple = new THREE.MeshStandardMaterial({ color: 0xcfd3d8, roughness: 0.3, metalness: 1, transparent: true });
const wood = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.8 });
const foam = new THREE.MeshStandardMaterial({ color: 0xe9d9a6, roughness: 1 });

const model = new THREE.Group();
scene.add(model);

// ---------- pad (board + foam + vinyl cover) ----------
const BOARD = { w: 10, h: 30, t: 1.5 };
const FOAM_T = 0.5;
const WRAP = 0.25;                      // vinyl + foam rolling over edges
const shellW = BOARD.w + WRAP * 2, shellH = BOARD.h + WRAP * 2;
const shellBack = -0.15, shellFront = BOARD.t + FOAM_T + 0.1;
const shellD = shellFront - shellBack;

const pad = new THREE.Group();
model.add(pad);

const shell = new THREE.Mesh(new RoundedBoxGeometry(shellW, shellH, shellD, 6, 0.55), vinyl);
shell.position.z = (shellFront + shellBack) / 2;
shell.castShadow = shell.receiveShadow = true;
pad.add(shell);

const board = new THREE.Mesh(new THREE.BoxGeometry(BOARD.w, BOARD.h, BOARD.t), wood);
board.position.z = BOARD.t / 2;
pad.add(board);
const foamMesh = new THREE.Mesh(new RoundedBoxGeometry(BOARD.w - 0.2, BOARD.h - 0.2, FOAM_T, 4, 0.2), foam);
foamMesh.position.z = BOARD.t + FOAM_T / 2;
pad.add(foamMesh);
board.visible = foamMesh.visible = false;

// back: fabric panel + staples
const fabW = shellW - 1.4, fabH = shellH - 1.4;
const back = new THREE.Mesh(new THREE.PlaneGeometry(fabW, fabH), fabric);
back.rotation.y = Math.PI;
back.position.z = shellBack - 0.02;
pad.add(back);

const stapleGeo = new THREE.BoxGeometry(1, 0.08, 0.06);
function addStaple(x, y, vertical) {
  const m = new THREE.Mesh(stapleGeo, staple);
  m.position.set(x, y, shellBack - 0.05);
  if (vertical) m.rotation.z = Math.PI / 2;
  pad.add(m);
}
const sx = fabW / 2 - 0.35, sy = fabH / 2 - 0.35;
for (let i = 0; i < 6; i++) {
  const y = -sy + 1.2 + i * ((2 * sy - 2.4) / 5);
  addStaple(sx, y, true); addStaple(-sx, y, true);
}
for (const y of [sy, -sy]) { addStaple(-sx + 1.3, y, false); addStaple(sx - 1.3, y, false); }

// ---------- square tube 4x4 ----------
const TUBE = { s: 4, wall: 0.2, len: 56, r: 0.45 };
function roundedRect(shape, w, h, r) {
  const x = -w / 2, y = -h / 2;
  shape.moveTo(x + r, y); shape.lineTo(x + w - r, y); shape.quadraticCurveTo(x + w, y, x + w, y + r);
  shape.lineTo(x + w, y + h - r); shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  shape.lineTo(x + r, y + h); shape.quadraticCurveTo(x, y + h, x, y + h - r);
  shape.lineTo(x, y + r); shape.quadraticCurveTo(x, y, x + r, y);
  return shape;
}
const tubeShape = roundedRect(new THREE.Shape(), TUBE.s, TUBE.s, TUBE.r);
tubeShape.holes.push(roundedRect(new THREE.Path(), TUBE.s - TUBE.wall * 2, TUBE.s - TUBE.wall * 2, TUBE.r - TUBE.wall));
const tubeGeo = new THREE.ExtrudeGeometry(tubeShape, { depth: TUBE.len, bevelEnabled: false, curveSegments: 6 });
tubeGeo.rotateX(-Math.PI / 2);
tubeGeo.translate(0, -TUBE.len / 2 - 6, 0);
const tube = new THREE.Mesh(tubeGeo, powder);
tube.castShadow = tube.receiveShadow = true;
const tubeGroup = new THREE.Group();
tubeGroup.add(tube);
tubeGroup.position.z = shellBack - TUBE.s / 2;
model.add(tubeGroup);

// ---------- screws (Phillips pan head) ----------
const SCREW_Y = 11;
const screwGroups = [];
function makeScrew() {
  const g = new THREE.Group();
  const flange = new THREE.Mesh(new THREE.CylinderGeometry(0.66, 0.66, 0.12, 32), zinc);
  flange.rotation.x = Math.PI / 2; flange.position.z = -0.06; g.add(flange);
  const domeGeo = new THREE.SphereGeometry(0.66, 32, 12, 0, Math.PI * 2, 0, Math.PI / 2);
  domeGeo.rotateX(-Math.PI / 2);
  const dome = new THREE.Mesh(domeGeo, zinc);
  dome.scale.z = 0.4; dome.position.z = -0.12; g.add(dome);
  for (const rot of [0, Math.PI / 2]) {
    const c = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.13, 0.05), recess);
    c.rotation.z = rot; c.position.z = -0.38; g.add(c);
  }
  const shankLen = TUBE.s + BOARD.t - 0.6;
  const shank = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.21, shankLen, 16), zinc);
  shank.rotation.x = Math.PI / 2; shank.position.z = shankLen / 2; g.add(shank);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.21, 0.6, 16), zinc);
  tip.rotation.x = Math.PI / 2; tip.position.z = shankLen + 0.3; g.add(tip);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return g;
}
for (const y of [SCREW_Y, -SCREW_Y]) {
  const s = makeScrew();
  s.position.set(0, y, shellBack - TUBE.s);
  model.add(s);
  screwGroups.push(s);
}

// ---------- dimension annotations ----------
const dims = new THREE.Group();
model.add(dims);
const dimMat = new THREE.LineBasicMaterial({ color: 0xc2410c });
function dimension(a, b, offset, text, est) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), O = new THREE.Vector3(...offset);
  const A2 = A.clone().add(O), B2 = B.clone().add(O);
  const ext = O.clone().normalize().multiplyScalar(0.6);
  const pts = [A, A2.clone().add(ext), B, B2.clone().add(ext), A2, B2];
  const dir = B2.clone().sub(A2).normalize();
  const tick = new THREE.Vector3().crossVectors(dir, O.clone().normalize()).normalize().multiplyScalar(0.35);
  for (const p of [A2, B2]) {
    const t = dir.clone().multiplyScalar(0.35).add(tick.clone().multiplyScalar(-1).add(O.clone().normalize().multiplyScalar(0.35)));
    pts.push(p.clone().sub(t), p.clone().add(t));
  }
  const line = new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), dimMat);
  dims.add(line);
  const el = document.createElement('div');
  el.className = 'dim' + (est ? ' est' : '');
  el.textContent = text;
  const lbl = new CSS2DObject(el);
  lbl.position.copy(A2.clone().add(B2).multiplyScalar(0.5));
  dims.add(lbl);
}
const zF = shellFront;
dimension([-BOARD.w / 2, -shellH / 2, zF], [BOARD.w / 2, -shellH / 2, zF], [0, -3, 0], '10 cm');
dimension([shellW / 2, -BOARD.h / 2, zF], [shellW / 2, BOARD.h / 2, zF], [3.5, 0, 0], '30 cm');
dimension([shellW / 2, shellH / 2, 0], [shellW / 2, shellH / 2, BOARD.t], [3, 4, 0], 'daska 1,5 cm');
dimension([-shellW / 2, shellH / 2, BOARD.t], [-shellW / 2, shellH / 2, zF], [-3, 2, 0], 'sunđer 0,5 cm');
const tubeBottom = -TUBE.len / 2 - 6;
dimension([-TUBE.s / 2, tubeBottom, shellBack - TUBE.s], [TUBE.s / 2, tubeBottom, shellBack - TUBE.s], [0, -2.5, 0], '4 × 4 cm');
dimension([-TUBE.s / 2 - 0.1, -SCREW_Y, shellBack - TUBE.s], [-TUBE.s / 2 - 0.1, SCREW_Y, shellBack - TUBE.s], [-3.5, 0, 0], 'vijci ≈22 cm', true);

// ---------- floor shadow catcher ----------
const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.ShadowMaterial({ opacity: 0.18 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = tubeBottom - 0.01;
floor.receiveShadow = true;
scene.add(floor);
controls.target.set(0, -4, 0);

// ---------- state & UI ----------
const state = { explode: 0, explodeT: 0, ghost: 0, ghostT: 0 };
const $ = id => document.getElementById(id);
function toggle(btn, on) { btn.setAttribute('aria-pressed', String(on)); }

$('tDims').onclick = e => { dims.visible = !dims.visible; toggle(e.currentTarget, dims.visible);
  dims.traverse(o => { if (o.isCSS2DObject) o.visible = dims.visible; }); };
$('tExplode').onclick = e => { state.explodeT = state.explodeT ? 0 : 1; toggle(e.currentTarget, !!state.explodeT); };
$('tGhost').onclick = e => { state.ghostT = state.ghostT ? 0 : 1; toggle(e.currentTarget, !!state.ghostT); };
$('tSpin').onclick = e => { controls.autoRotate = !controls.autoRotate; toggle(e.currentTarget, controls.autoRotate); };

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.autoRotate = !reduced;
controls.autoRotateSpeed = 1.2;
toggle($('tSpin'), controls.autoRotate);
renderer.domElement.addEventListener('pointerdown', () => { if (controls.autoRotate) { controls.autoRotate = false; toggle($('tSpin'), false); } });

function fitDistance() { return camera.aspect < 0.8 ? 120 : 95; }
let camAnim = null;
function goTo(dir) {
  controls.autoRotate = false; toggle($('tSpin'), false);
  const d = fitDistance();
  const to = new THREE.Vector3(...dir).normalize().multiplyScalar(d).add(controls.target);
  camAnim = { from: camera.position.clone(), to, t: 0 };
}
$('vFront').onclick = () => goTo([0.15, 0.12, 1]);
$('vBack').onclick = () => goTo([-0.45, 0.2, -1]);
$('vSide').onclick = () => goTo([1, 0.1, 0.02]);

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); labelRenderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
camera.position.copy(new THREE.Vector3(0.75, 0.3, 1).normalize().multiplyScalar(fitDistance()).add(controls.target));

const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const k = reduced ? 1 : 1 - Math.pow(0.002, dt);
  state.explode += (state.explodeT - state.explode) * k;
  state.ghost += (state.ghostT - state.ghost) * k;

  tubeGroup.position.z = shellBack - TUBE.s / 2 - state.explode * 7;
  for (const s of screwGroups) s.position.z = shellBack - TUBE.s - state.explode * 15;

  const op = 1 - state.ghost * 0.8;
  vinyl.opacity = op; fabric.opacity = op; staple.opacity = op;
  vinyl.depthWrite = fabric.depthWrite = op > 0.99;
  board.visible = foamMesh.visible = state.ghost > 0.02;

  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + dt / (reduced ? 0.001 : 0.9));
    camera.position.lerpVectors(camAnim.from, camAnim.to, ease(camAnim.t));
    if (camAnim.t >= 1) camAnim = null;
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});
</script>

</html>
